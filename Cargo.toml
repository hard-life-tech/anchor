[package]
name = "anchor"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Sync GitHub repos to worktrees and orchestrate coding agents in tmux"
repository = "https://github.com/hard-life-tech/anchor"
readme = "README.md"

[[bin]]
name = "anchor"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tempfile = "3"
askama = "0.16"
askama_web = { version = "0.16", features = ["axum-0.8"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
