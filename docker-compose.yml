services:
  anchor:
    build: .
    restart: unless-stopped
    # Required in `.env` (see `.env.example`): GITHUB_TOKEN, GITHUB_USER, ANCHOR_PASSWORD.
    # Optional overrides below; defaults match PROJECT.md §6.
    env_file: .env
    environment:
      - PROJECTS_DIR=/home/agent/projects
      - TMUX_SESSION=agents
      - PORT=8080
      - DATABASE_URL=sqlite:/home/agent/projects/anchor.db
    volumes:
      - agent-home:/home/agent
      - tmux-sockets:/tmp
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Prod / Traefik / Coolify: use docker-compose.prod.yml to drop host
    # port publish and attach to your proxy network instead.
    # Keep it off the public internet either way — Tailscale + ANCHOR_PASSWORD.

  # Optional legacy sidecar (built-in xterm.js terminal is preferred):
  # ttyd:
  #   image: ghcr.io/tsl0922/ttyd:latest
  #   restart: unless-stopped
  #   command: ["ttyd", "-W", "tmux", "attach", "-t", "agents"]
  #   user: "1000:1000"
  #   volumes:
  #     - tmux-sockets:/tmp
  #   ports:
  #     - "7681:7681"

volumes:
  agent-home:
  tmux-sockets:
